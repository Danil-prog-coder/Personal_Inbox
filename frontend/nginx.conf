server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # API и OAuth-возврат Gmail уходят на бэкенд по имени сервиса compose.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Лента обновляется через SSE: буферизацию и таймаут чтения снимаем,
    # иначе поток /api/stream рвётся и события копятся у прокси.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  # Клиентский роутинг react-router: любой путь отдаёт index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
